<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BudgetBuddy AI — Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>

<div class="shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">💰</div>
      <div class="brand-name">BudgetBuddy AI</div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link active"><span class="icon">🏠</span><span>Dashboard</span></a>
      <a href="savings.html" class="sidebar-link"><span class="icon">🎯</span><span>Savings</span></a>
      <a href="assistant.html" class="sidebar-link"><span class="icon">🤖</span><span>Assistant</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="avatar">A</div>
      <div class="avatar-name">Aina</div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content">
    <div class="page-topbar">
      <div class="avatar">A</div>
    </div>

    <div class="app">

      <!-- Balance hero -->
      <div class="balance-card">
        <div class="balance-label">Total Balance</div>
        <div class="balance-amount" id="total-balance">Rs. 0</div>
        <div class="balance-split">
          <div><span>Income</span><strong id="total-income">Rs. 0</strong></div>
          <div><span>Expenses</span><strong id="total-expense">Rs. 0</strong></div>
        </div>
      </div>

      <!-- Anomaly alert -->
      <div class="anomaly-banner hidden" id="anomaly-alert"></div>

      <!-- Quick actions -->
      <div class="quick-actions">
        <button id="show-add-transaction">➕ Add Expense</button>
        <button id="show-add-income">💵 Add Income</button>
      </div>

      <!-- Add transaction form -->
      <div class="form-panel hidden" id="transaction-panel">
        <div class="section-head"><h2>Add Transaction</h2></div>
        <form id="transaction-form">
          <div class="form-row">
            <input type="number" id="amount" placeholder="Amount (Rs.)" required>
            <input type="text" id="description" placeholder="Description (e.g. Careem ride)" required>
            <input type="date" id="date" required>
          </div>
          <div class="form-row" style="margin-top:12px;">
            <button type="submit" class="btn-primary">Save Transaction</button>
            <button type="button" class="btn-secondary" id="cancel-transaction">Cancel</button>
          </div>
        </form>
      </div>

      <!-- Spending breakdown + transactions -->
      <div class="grid-two">
        <div class="panel">
          <div class="section-head"><h2>Spending Breakdown</h2></div>
          <canvas id="category-chart" height="200"></canvas>
          <div class="legend" id="category-legend"></div>
        </div>

        <div class="panel">
          <div class="section-head"><h2>Recent Transactions</h2></div>
          <ul class="tx-list" id="tx-list">
            <!-- injected by dashboard.js -->
          </ul>
        </div>
      </div>

    </div>
  </main>

</div>

<script src="common.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
